name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    name: Docker acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Style and formatting
        run: make lint
      - name: Tooling, distributed demos, and failure cases
        run: make test
      - name: Upstream recipe downloads and failure cases
        run: make test-recipe
      - name: Scale workers from one to three
        run: make test-scale
      - name: Recreate containers and verify persisted history
        run: make test-lifecycle
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p .artifacts
          docker compose logs --no-color > .artifacts/compose.log
          docker compose ps -a > .artifacts/containers.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playground-evidence
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
      - name: Stop playground
        if: always()
        run: make down

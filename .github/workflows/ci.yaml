name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    name: Docker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Style and formatting
        run: make lint
      - name: Tooling, distributed demos, and failure cases
        run: make test
      - name: Scale workers from one to three
        run: make test-scale
      - name: Recreate containers and verify persisted history
        run: make test-lifecycle
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p .artifacts
          docker compose logs --no-color > .artifacts/compose.log
          docker compose ps -a > .artifacts/containers.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playground-evidence
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
      - name: Stop playground
        if: always()
        run: make down
